    <div id="imagemodel" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background-color:rgba(0,0,0,0.8);
        justify-content:center;
        align-items:center;
        z-index:9999;
        cursor:zoom-out;
    ">
        <img id="bigImage" src="" alt="Zoomed Image" style="
            max-width:90%;
            max-height:90%;
            box-shadow:0 0 20px rgba(255,255,255,0.5);
        ">
    </div>
    <script>
      var zoomableImages = document.querySelectorAll('.zoomable');
      var imagemodel = document.getElementById('imagemodel'); 
      var bigImage = document.getElementById('bigImage');
      zoomableImages.forEach(function(image) {
          image.onclick = function() {
              bigImage.src = this.src;
              imagemodel.style.display = 'flex';
          };
      });
     imagemodel.onclick = function() {
          imagemodel.style.display = 'none';
      };
      function openinfomodal(imageSrc,text){
        var infomodal = document.getElementById('infomodol');
        var infomodalImage = document.getElementById('infomodalImage');
        var infomodalText = document.getElementById('infomodalText');
        infomodalText.innerText = text;
        if(imageSrc){
            infomodalImage.src = imageSrc;
            infomodalImage.style.display = 'block';
        } else {
            infomodalImage.style.display = 'none';
        }
        infomodal.style.display = 'flex';
      }
      function closeinfomodal(){
        var infomodal = document.getElementById('infomodol');
        infomodal.style.display = 'none';
      }
    </script> 
    <div id="infomodol" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background-color:rgba(0,0,0,0.5);
        justify-content:center;
        align-items:center;
        z-index:9999;"
        onclick="closeinfomodal()"
        >
        <div style="
            background-color:white;
            width:400px;
            padding:20px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
            text-align:center;
            position:relative;"
            onclick="event.stopPropagation()"
            >
        <span onclick="closeinfomodal()" style="
            position:absolute;
            top:10px;
            right:15px;
            cursor:pointer;
            font-size:20px;
            color:#aaa;
            font-weight:bold;">&times;</span>

            ">

        "></p>
